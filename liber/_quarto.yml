filters:
  - _filters/icfes-tables.lua
  - _filters/wide-tables.lua
  - _filters/custom-questions.lua

format:
  typst:
    default: true
    toc: false
    toc-depth: 2
    number-sections: true
    keep-typ: true
    paper: a4
    margin:
      x: 2cm
      y: 2.5cm
    lang: es
    mainfont: "Palatino"
    sansfont: "Palatino"
    fontsize: 11pt
    linestretch: 1.4
    template-partials:
      - _templates/typst/numbering.typ
      - _templates/typst/page.typ
      - _templates/typst/typst-show.typ

  pdf:
    documentclass: scrbook
    classoption: [12pt, oneside, open=any, DIV=15]
    keep-tex: true
    latex-auto-install: false
    include-in-header: preamble.tex
    filters:
      - _filters/span-colors.lua
      - _filters/color-sections.lua
      - _filters/table-styling.lua
    toc: true
    toc-depth: 1
    number-depth: 3
    number-sections: false
    lang: es
    colorlinks: true
    linkcolor: docere-link
    citecolor: docere-cite
    urlcolor: docere-url
    highlight-style: pygments
    mermaid-format: svg

  html:
    theme: _styles/natura-docens.scss
    toc: true
    toc-depth: 3
    toc-location: right
    number-sections: true
    number-depth: 3
    lang: es
    include-in-header:
      - _scripts/mobile-head.html
    include-after-body:
      - _scripts/collapse.html
      - _scripts/a11y.html
      - _scripts/section-pager.html
    mermaid:
      theme: neutral


  epub:
    cover-image: Portada.png
    css: _styles/natura-docens-epub.css
    toc: true
    toc-depth: 3
    number-sections: false
    math-method: mathml
    meta:
      dc:creator: "Camilo Tayac"
      dc:publisher: "Docere"
      dc:language: es
      dc:description: "Natura Docens - Ciencias Naturales. Libro interactivo de química para educación media."

