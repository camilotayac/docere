<style>
#docere-progress-container {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 8px;
  background-color: var(--table-bg, #FAFAF8);
  z-index: 999999 !important;
  border-top: 1px solid rgba(0,0,0,0.1);
}
#docere-progress-bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #5A7BA8, #4A9B6B);
  transition: width 0.1s ease-out;
  border-top-right-radius: 4px;
  border-bottom-right-radius: 4px;
}
</style>
<div id="docere-progress-container" aria-hidden="true">
  <div id="docere-progress-bar"></div>
</div>
<script>
(function() {
  'use strict';

  // Helper: DOM Manipulation for details (ICFES restructuring)
  function restructureDetails() {
    const openDetails = document.querySelectorAll('details.icfes-respuesta');
    openDetails.forEach(d => {
      const parent = d.parentNode;
      const children = Array.from(d.children);
      let insertBefore = d.nextSibling;
      for (let k = children.length - 1; k >= 0; k--) {
        const child = children[k];
        if (child.tagName === 'SECTION' && !child.classList.contains('clave-respuestas')) {
          parent.insertBefore(child, insertBefore);
          insertBefore = child;
        }
      }
    });
  }

  // Helper: Scroll Progress Bar
  function initProgressBar() {
    const progressBar = document.getElementById('docere-progress-bar');
    if (!progressBar) return;

    function updateProgress() {
      const scrollTop = window.scrollY || document.documentElement.scrollTop;
      const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      
      if (scrollHeight <= 0) {
        progressBar.style.width = '0%';
        return;
      }
      
      const scrolled = (scrollTop / scrollHeight) * 100;
      // Clamp between 0 and 100
      progressBar.style.width = Math.min(100, Math.max(0, scrolled)) + '%';
    }

    window.addEventListener('scroll', () => {
      requestAnimationFrame(updateProgress);
    }, { passive: true, capture: true }); // Capture true to catch scroll on any element just in case
    
    // Fallback: also listen on body
    document.body.addEventListener('scroll', () => {
      requestAnimationFrame(updateProgress);
    }, { passive: true, capture: true });
    
    // Initial call
    updateProgress();
    console.log("Natura Docens: Progress bar initialized.");
  }

  // Helper: Force all sidebar sections to start collapsed
  function collapseAllSidebarSections() {
    const sidebar = document.getElementById('quarto-sidebar');
    if (!sidebar) return;

    const sections = sidebar.querySelectorAll('.sidebar-section.collapse');
    sections.forEach(sec => {
      sec.classList.remove('show');
    });

    const toggles = sidebar.querySelectorAll('.sidebar-item-toggle, .sidebar-link');
    toggles.forEach(t => {
      t.classList.add('collapsed');
      t.setAttribute('aria-expanded', 'false');
    });
  }

  document.addEventListener('DOMContentLoaded', () => {
    restructureDetails();
    initProgressBar();
    collapseAllSidebarSections();
  });

})();
</script>
